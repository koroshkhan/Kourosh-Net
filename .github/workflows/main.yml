              private fun readCpuFreqAndGovernor(): String {
                  return try {
                      val maxFreqFile = File("/sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq")
                      val mhz = if (maxFreqFile.exists()) "${maxFreqFile.readText().trim().toLong() / 1000} MHz" else "Boost"
                      "$mhz (schedutil)"
                  } catch (_: Exception) { "Hardware Auto-Boost" }
              }

              private fun readRamStatus(): String {
                  return try {
                      val mi = ActivityManager.MemoryInfo()
                      activityManager.getMemoryInfo(mi)
                      "${"%.1f".format(mi.availMem / 1073741824.0)} GB آزاد از ${"%.1f".format(mi.totalMem / 1073741824.0)} GB"
                  } catch (_: Exception) { "RAM Optimized" }
              }

              private fun readKernelAndTcpCongestion(): String {
                  return try {
                      val kVer = (System.getProperty("os.version") ?: "Linux").take(16)
                      "Kernel $kVer | TCP BBR/Cubic"
                  } catch (_: Exception) { "Linux Kernel Optimized" }
              }

              private fun estimateTowerDistanceMeters(rsrpDbm: Int, timingAdvance: Int?): Int {
                  if (timingAdvance != null && timingAdvance > 0) return (timingAdvance * 78).coerceIn(50, 15000)
                  val exponent = (-48.0 - rsrpDbm) / 28.0
                  return (10.0.pow(exponent) * 18.0).toInt().coerceIn(60, 12000)
              }

              fun isSystemVpnConnected(): Boolean {
                  return try {
                      val activeNet = connectivityManager.activeNetwork ?: return false
                      val caps = connectivityManager.getNetworkCapabilities(activeNet) ?: return false
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                  } catch (_: Exception) { false }
              }

              fun setHardwareWakeLock(enable: Boolean): String {
                  return try {
                      if (enable) {
                          if (modemWakeLock == null) modemWakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Kourosh::TurboModemLock")
                          if (modemWakeLock?.isHeld == false) modemWakeLock?.acquire(4 * 60 * 60 * 1000L)
                          if (wifiHighPerfLock == null) {
                              @Suppress("DEPRECATION")
                              wifiHighPerfLock = wifiManager.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Kourosh::WifiLock")
                          }
                          if (wifiHighPerfLock?.isHeld == false) wifiHighPerfLock?.acquire()
                          "🔥 قفل توان حداکثری فعال شد."
                      } else {
                          if (modemWakeLock?.isHeld == true) modemWakeLock?.release()
                          if (wifiHighPerfLock?.isHeld == true) wifiHighPerfLock?.release()
                          "قفل آزاد شد."
                      }
                  } catch (e: Exception) { "خطا: ${e.message}" }
              }

              fun releaseAllLocksOnExit() { setHardwareWakeLock(false) }

              private fun decodeIfBase64(input: String): String {
                  if (input.contains("vless://") || input.contains("vmess://")) return input
                  return try {
                      val clean = input.filter { !it.isWhitespace() }
                      String(android.util.Base64.decode(clean, android.util.Base64.DEFAULT), Charsets.UTF_8)
                  } catch (_: Exception) { input }
              }

              private fun vibratePulse(ms: Long) {
                  try {
                      val v = context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  } catch (_: Exception) {}
              }
          }
