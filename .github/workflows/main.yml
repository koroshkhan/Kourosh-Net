name: Build Kourosh NetOptimizer APK (Smart Path + Cached)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Cache Android SDK & Xray Core AAR
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/build-tools/34.0.0
            **/app/libs/libv2ray.aar
          key: android-xray-core-v3-${{ runner.os }}
          restore-keys: |
            android-xray-core-v3-

      - name: 4. Prepare Project Directory & Download Xray Core
        run: |
          # تشخیص خودکار مسیر پروژه (چه فایل‌ها در ریشه باشند و چه داخل پوشه Kourosh-NetOptimizer)
          if [ -d "Kourosh-NetOptimizer/app" ]; then
            cd Kourosh-NetOptimizer
          fi
          
          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            echo "Downloading Android Xray/Libv2ray Core..."
            curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.vfs.watch=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: 5. Setup Gradle 8.5 with Dependency Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: 6. Compile Debug APK
        run: |
          if [ -d "Kourosh-NetOptimizer/app" ]; then
            cd Kourosh-NetOptimizer
          fi
          gradle assembleDebug --build-cache --no-daemon --stacktrace

      - name: 7. Upload Compiled APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-NetOptimizer-Xray-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
