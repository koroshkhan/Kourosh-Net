name: Build Kourosh NetRadar AI APK (Auto-Sync + Cached)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Cache Static Binaries (Gradle 8.5 + Xray libv2ray.aar)
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle/gradle-8.5
            app/libs/libv2ray.aar
          key: static-tools-gradle85-xray-v2

      - name: 4. Cache Android & Kotlin Dependencies (Zero Re-download)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-deps-v2-${{ runner.os }}
          restore-keys: |
            gradle-deps-v2-
            gradle-deps-v1-

      - name: 5. Auto-Generate Verified Kotlin Files & Setup Cache
        run: |
          if [ ! -f "/opt/gradle/gradle-8.5/bin/gradle" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            sudo mkdir -p /opt/gradle
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            sudo chmod -R 777 /opt/gradle
          fi

          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi

          python3 - << 'EOF'
          import os

          files = {
              "settings.gradle.kts": """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KouroshNetOptimizer"
          include(":app")
          """,

              "build.gradle.kts": """plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """,

              "gradle.properties": """android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          """,

              "app/build.gradle.kts": """plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kourosh.netoptimizer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kourosh.netoptimizer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-AI-Pro"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.aar", "*.jar"))))
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          """,

              "app/src/main/AndroidManifest.xml": """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:label="Kourosh NetRadar AI"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KouroshVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          """,

              "app/src/main/java/com/kourosh/netoptimizer/XrayConfigBuilder.kt": """package com.kourosh.netoptimizer

          import android.net.Uri
          import org.json.JSONArray
          import org.json.JSONObject

