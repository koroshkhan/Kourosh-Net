                                                  downloadProgress = 0
                                                  scope.launch {
                                                      statusBanner = "⏳ در حال دانلود با بافر سخت‌افزاری ${telemetry.recommendedSocketBufferKb}KB..."
                                                      statusBanner = engine.runParallelTurboDownload(downloadUrl, 8) { mbps, mb, pct ->
                                                          liveSpeedMbps = mbps; downloadedMb = mb; downloadProgress = pct
                                                      }
                                                      isDownloading = false
                                                  }
                                              }
                                          },
                                          enabled = !isDownloading,
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981)),
                                          modifier = Modifier.weight(1f).height(48.dp)
                                      ) {
                                          Text(if (isDownloading) "⏳ در حال دریافت..." else "📥 شروع دانلود / تست سرعت", color = Color(0xFF020617), fontWeight = FontWeight.ExtraBold, fontSize = 12.sp)
                                      }

                                      if (downloadUrl.isNotEmpty()) {
                                          Button(
                                              onClick = { downloadUrl = "" },
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF334155)),
                                              modifier = Modifier.height(48.dp)
                                          ) {
                                              Text("پاک کردن لینک", color = Color.White, fontSize = 11.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // ==================== تب ۴: بررسی و دانلود واقعی درایورهای سخت‌افزار ====================
                      if (selectedTab == 3) {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF0F172A)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth().border(1.dp, Color(0xFFF59E0B), RoundedCornerShape(16.dp))) {
                              Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Text("🔧 بررسی و دانلود مستقیم درایورهای سخت‌افزار گوشی", color = Color(0xFFFBBF24), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                  driversList.forEach { drv ->
                                      Column(modifier = Modifier.fillMaxWidth().background(Color(0xFF020617), RoundedCornerShape(12.dp)).padding(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                          Text(drv.componentName, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                          Text("نسخه فعلی: ${drv.currentDriverVersion}", color = Color(0xFF38BDF8), fontSize = 11.sp)
                                          Text(drv.statusBadge, color = Color(0xFF34D399), fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                          Text(drv.updateDescription, color = Color(0xFF94A3B8), fontSize = 10.sp)
                                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                              Button(
                                                  onClick = {
                                                      downloadUrl = drv.directDownloadUrl
                                                      selectedTab = 2
                                                      if (!isDownloading) {
                                                          isDownloading = true
                                                          downloadProgress = 0
                                                          scope.launch {
                                                              statusBanner = "⏳ در حال دانلود مستقیم ${drv.fileName} در پوشه Download..."
                                                              statusBanner = engine.runParallelTurboDownload(drv.directDownloadUrl, 8) { mbps, mb, pct ->
                                                                  liveSpeedMbps = mbps; downloadedMb = mb; downloadProgress = pct
                                                              }
                                                              isDownloading = false
                                                          }
                                                      }
                                                  },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981)),
                                                  modifier = Modifier.weight(1f)
                                              ) {
                                                  Text("📥 دانلود مستقیم در گوشی", color = Color(0xFF020617), fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                              }
                                              Button(
                                                  onClick = { statusBanner = engine.openDriverUpdateWebPage(drv.fallbackWebPage) },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF334155)),
                                                  modifier = Modifier.weight(1f)
                                              ) {
                                                  Text("🌐 مخزن رسمی شیائومی", color = Color.White, fontSize = 11.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      Text(statusBanner, color = Color(0xFF34D399), fontSize = 12.sp, modifier = Modifier.fillMaxWidth().background(Color(0xFF0F172A), RoundedCornerShape(12.dp)).padding(12.dp))
                  }
              }
          }

          @Composable
          fun MetricBox(title: String, value: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.background(Color(0xFF020617), RoundedCornerShape(10.dp)).padding(horizontal = 8.dp, vertical = 8.dp)) {
                  Text(title, color = Color(0xFF94A3B8), fontSize = 10.sp)
                  Text(value, color = Color(0xFF38BDF8), fontWeight = FontWeight.Bold, fontSize = 12.sp)
              }
          }
          """
          }

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")
          print("All v5.0 project files generated cleanly.")
          EOF

      - name: 6. Compile Debug APK
        run: /opt/gradle/gradle-8.5/bin/gradle assembleDebug --build-cache --no-daemon

      - name: 7. Upload Compiled APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-NetOptimizer-Xray-APK
          path: app/build/outputs/apk/debug/app-debug.apk
