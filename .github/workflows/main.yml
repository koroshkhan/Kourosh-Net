name: Build Kourosh NetOptimizer APK (Permanent Cache)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Cache Static Binaries (Gradle 8.5 + Xray libv2ray.aar)
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle/gradle-8.5
            **/app/libs/libv2ray.aar
          key: static-tools-gradle85-xray-v1

      - name: 4. Cache Android & Kotlin Dependencies (Zero Re-download on Code Edit)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-deps-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-deps-v1-${{ runner.os }}-

      - name: 5. Install Gradle 8.5 & Xray Core (Only on First Run if Not Cached)
        run: |
          if [ ! -f "/opt/gradle/gradle-8.5/bin/gradle" ]; then
            echo "Downloading Gradle 8.5 once for cache..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            sudo mkdir -p /opt/gradle
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            sudo chmod -R 777 /opt/gradle
          fi

          if [ -d "Kourosh-NetOptimizer/app" ]; then
            cd Kourosh-NetOptimizer
          fi

          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            echo "Downloading Android Xray Core (libv2ray.aar) once for cache..."
            curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          fi

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: 6. Compile Debug APK
        run: |
          if [ -d "Kourosh-NetOptimizer/app" ]; then
            cd Kourosh-NetOptimizer
          fi
          /opt/gradle/gradle-8.5/bin/gradle assembleDebug --build-cache --no-daemon

      - name: 7. Upload Compiled APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-NetOptimizer-Xray-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
